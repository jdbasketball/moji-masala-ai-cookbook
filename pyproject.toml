[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moji-masala-ai-cookbook"
version = "0.1.0"
description = "Source-backed recipe and spice-kit matching with OpenAI and Claude examples"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT (code only; see data/README.md for content rights)"}
authors = [{name = "moji masala"}]
dependencies = []

[project.optional-dependencies]
providers = ["openai>=1.68,<3", "anthropic>=0.49,<1"]

[project.scripts]
moji-demo = "moji_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/moji-masala-ai-cookbook" = ["data/catalog.json", "data/evaluation.json"]
